<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vérifier un document</title>
<style>
  :root { --bg:#f7f7f4; --card:#ffffff; --ink:#1d2228; --muted:#5c6670; --line:#d9dcd6;
          --ok:#1f7a4d; --ok-bg:#e7f4ec; --no:#9a3b1e; --no-bg:#fbece6; --accent:#24527a; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#15181b; --card:#1d2125; --ink:#e7e9ea; --muted:#9aa3ab;
      --line:#2e3439; --ok:#5fc48f; --ok-bg:#14291e; --no:#f09a7c; --no-bg:#2c1a14; --accent:#7fb0dc; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
  main { max-width:640px; margin:0 auto; padding:32px 16px 48px; }
  h1 { font-size:1.6rem; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 24px; }
  .drop { display:block; border:2px dashed var(--line); border-radius:12px; background:var(--card);
          padding:40px 16px; text-align:center; cursor:pointer; transition:border-color .15s; }
  .drop.over, .drop:hover { border-color:var(--accent); }
  .drop strong { display:block; font-size:1.1rem; }
  .drop span { color:var(--muted); font-size:.9rem; }
  input[type=file] { display:none; }
  .row { display:flex; gap:8px; margin-top:12px; }
  .row input { flex:1; min-width:0; padding:10px 12px; border:1px solid var(--line); border-radius:8px;
               background:var(--card); color:var(--ink); font:14px ui-monospace,Menlo,monospace; }
  button { padding:10px 16px; border:0; border-radius:8px; background:var(--accent); color:#fff;
           font-weight:600; cursor:pointer; }
  .result { margin-top:24px; border-radius:12px; padding:20px; display:none; }
  .result.ok { display:block; background:var(--ok-bg); border:1px solid var(--ok); }
  .result.no { display:block; background:var(--no-bg); border:1px solid var(--no); }
  .result.err { display:block; background:var(--card); border:1px solid var(--line); }
  .result h2 { margin:0 0 12px; font-size:1.2rem; }
  .ok h2 { color:var(--ok); } .no h2 { color:var(--no); }
  dl { margin:0; display:grid; grid-template-columns:max-content 1fr; gap:4px 16px; }
  dt { color:var(--muted); } dd { margin:0; overflow-wrap:anywhere; }
  .mono { font-family:ui-monospace,Menlo,monospace; font-size:.85rem; }
  .node { margin-top:32px; color:var(--muted); font-size:.85rem; }
  .node input { width:100%; padding:6px 8px; border:1px solid var(--line); border-radius:6px;
                background:var(--card); color:var(--ink); font:13px ui-monospace,Menlo,monospace; }
  .pill { display:inline-block; padding:1px 8px; border-radius:999px; font-size:.8rem; border:1px solid currentColor; }
</style>
</head>
<body>
<main>
  <h1>Vérifier un document</h1>
  <p class="sub">Déposez un fichier. Son empreinte est calculée sur votre appareil ; le fichier n'est envoyé nulle part.
     Le registre dit s'il a été inscrit, par qui et quand.</p>

  <label class="drop" id="drop">
    <strong>Déposez le fichier ici</strong>
    <span>ou cliquez pour le choisir</span>
    <input type="file" id="file">
  </label>

  <div class="row">
    <input id="hash" placeholder="ou collez une empreinte (64 caractères hexadécimaux)" spellcheck="false">
    <button id="go">Vérifier</button>
  </div>

  <section class="result" id="result" aria-live="polite"></section>

  <div class="node">
    <label for="rpc" id="rpclabel">Nœud interrogé (votre propre copie du registre) :</label>
    <input id="rpc">
    <p id="status">…</p>
  </div>
</main>
<script>
// Known authors. A record carries the author's account (SS58); names come from here.
const AUTHORS = {
  "5HQwLyQjcPCpL5T8p3jifVUC8rBxfKXfSzazStmbH4FwnBmT": "Paraxiom (démonstration)",
};
const STATUS = { Active: "Active", Revoked: "Révoquée", Expired: "Expirée", Certified: "Certifiée" };
const CATEGORY = { "Academic Credential": "Diplôme", "Legal Document": "Document juridique", "Contract": "Contrat",
  "Intellectual Property": "Propriété intellectuelle", "Identity": "Identité", "Financial": "Document financier",
  "Medical": "Médical", "Other": "Autre", "Audit Anchor": "Ancrage d'audit" };
const BLOCK_SECONDS = 3;
// On the public site, the public read-only gateway; anywhere else, your own node.
const PUBLIC_SITE = location.hostname === "validateurs.paraxiom.org";
const DEFAULT_RPC = PUBLIC_SITE ? "/rpc" : "http://127.0.0.1:9944";

const $ = (id) => document.getElementById(id);
const rpcUrl = () => $("rpc").value.trim();

async function rpc(method, params = []) {
  const r = await fetch(rpcUrl(), { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ jsonrpc: "2.0", id: 1, method, params }) });
  const j = await r.json();
  if (j.error) throw new Error(j.error.message || JSON.stringify(j.error));
  return j.result;
}

const bytesToHex = (b) => "0x" + [...b].map(x => x.toString(16).padStart(2, "0")).join("");
function hexToBytes(h) { h = h.replace(/^0x/, ""); const b = new Uint8Array(h.length / 2);
  for (let i = 0; i < b.length; i++) b[i] = parseInt(h.substr(i * 2, 2), 16); return b; }
function compactAt(b, i) {   // SCALE compact integer at b[i]: [value, next index]
  const m = b[i] & 3;
  if (m === 0) return [b[i] >> 2, i + 1];
  if (m === 1) return [(b[i] | b[i + 1] << 8) >> 2, i + 2];
  if (m === 2) return [((b[i] | b[i + 1] << 8 | b[i + 2] << 16) + b[i + 3] * 16777216) / 4, i + 4];
  const n = (b[i] >> 2) + 4; let v = 0;
  for (let k = n - 1; k >= 0; k--) v = v * 256 + b[i + 1 + k];
  return [v, i + 1 + n];
}

// --- registry lookups (node RPC methods, open on the public gateway too) ----
async function lookup(hashHex) {
  const n = await rpc("quantumharmony_getNotarization", [hashHex]);
  if (!n) return null;
  const a = await rpc("notarial_getAttestation", [n.attestationId]);
  return { id: n.attestationId, block: n.blockNumber, blockHash: n.blockHash, status: a.status,
           label: a.description, category: a.category, author: a.attester };
}

// The block's first extrinsic is Timestamp::set(now): read the time from it.
async function whenRecorded(block, blockHash) {
  try {
    const h = blockHash || await rpc("chain_getBlockHash", [block]);
    const ext = hexToBytes((await rpc("chain_getBlock", [h])).block.extrinsics[0]);
    let [, i] = compactAt(ext, 0);            // length prefix
    i += 1;                                   // extrinsic version byte
    if (ext[i] === 1 && ext[i + 1] === 0) {   // Timestamp (pallet 1), set (call 0)
      const [ms] = compactAt(ext, i + 2);
      if (ms > 1.6e12 && ms < 4e12) return { date: new Date(ms), exact: true };
    }
  } catch (_) {}
  const best = parseInt((await rpc("chain_getHeader")).number, 16);
  return { date: new Date(Date.now() - (best - block) * BLOCK_SECONDS * 1000), exact: false };
}

// --- UI ----------------------------------------------------------------------
function show(kind, html) { const el = $("result"); el.className = "result " + kind; el.innerHTML = html; }
const fmt = (d) => d.toLocaleString("fr-CA", { dateStyle: "long", timeStyle: "short" });

async function check(hashHex, fileName) {
  hashHex = hashHex.toLowerCase().replace(/^0x/, "");
  if (!/^[0-9a-f]{64}$/.test(hashHex)) return show("err", "<h2>Empreinte invalide</h2><p>Il faut 64 caractères hexadécimaux.</p>");
  hashHex = "0x" + hashHex;
  history.replaceState(null, "", "?h=" + hashHex.slice(2));
  show("err", "<p>Interrogation du registre…</p>");
  try {
    const rec = await lookup(hashHex);
    const what = fileName ? `<dt>Fichier</dt><dd>${escapeHtml(fileName)}</dd>` : "";
    if (!rec) return show("no", `<h2>Aucune inscription pour ce fichier exact</h2>
      <dl>${what}<dt>Empreinte</dt><dd class="mono">${hashHex}</dd></dl>
      <p>Un seul caractère modifié donne une autre empreinte. Si le document a été inscrit, c'est une autre version.</p>`);
    const when = await whenRecorded(rec.block, rec.blockHash);
    const who = AUTHORS[rec.author] || `compte ${rec.author.slice(0, 8)}…${rec.author.slice(-6)}`;
    show("ok", `<h2>✅ Inscrit au registre <span class="pill">${escapeHtml(STATUS[rec.status] || rec.status)}</span></h2>
      <dl>${what}
        <dt>Par</dt><dd>${escapeHtml(who)}</dd>
        <dt>Le</dt><dd>${when.exact ? "" : "vers le "}${fmt(when.date)}</dd>
        <dt>Bloc</dt><dd>n° ${rec.block.toLocaleString("fr-CA")}</dd>
        <dt>Libellé</dt><dd>${escapeHtml(rec.label || "—")} · ${escapeHtml(CATEGORY[rec.category] || rec.category)}</dd>
        <dt>Inscription</dt><dd>n° ${rec.id}</dd>
        <dt>Empreinte</dt><dd class="mono">${hashHex}</dd>
      </dl>`);
  } catch (e) {
    show("err", `<h2>Le registre ne répond pas</h2><p>${escapeHtml(e.message)}</p>
      <p>${PUBLIC_SITE ? "Réessayez dans un instant." : "Vérifiez que votre nœud tourne (<code>./verify.sh --status</code>) et l'adresse ci-dessous."}</p>`);
  }
}
const escapeHtml = (s) => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

async function fileHash(file) {
  const d = await crypto.subtle.digest("SHA-256", await file.arrayBuffer());
  return bytesToHex(new Uint8Array(d));
}
async function onFile(f) { if (!f) return; $("hash").value = await fileHash(f); check($("hash").value, f.name); }

$("file").addEventListener("change", (e) => onFile(e.target.files[0]));
const drop = $("drop");
["dragenter", "dragover"].forEach(ev => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach(ev => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", (e) => onFile(e.dataTransfer.files[0]));
$("go").addEventListener("click", () => check($("hash").value));
$("hash").addEventListener("keydown", (e) => { if (e.key === "Enter") check($("hash").value); });

async function nodeStatus() {
  try {
    const [h, f, s] = await Promise.all([rpc("chain_getHeader"), rpc("chain_getFinalizedHead"), rpc("system_health")]);
    const best = parseInt(h.number, 16);
    $("status").textContent = `Connecté : bloc n° ${best.toLocaleString("fr-CA")}, ${s.peers} pair(s)` +
      (s.isSyncing ? ", synchronisation en cours (les inscriptions récentes peuvent manquer)" : ", à jour");
  } catch (e) { $("status").textContent = "Pas de réponse du nœud à cette adresse."; }
}
$("rpc").value = DEFAULT_RPC;
if (PUBLIC_SITE) $("rpclabel").textContent = "Registre interrogé : passerelle publique de Paraxiom, en lecture seule. Avec votre propre nœud, c'est votre copie qui répond :";
$("rpc").addEventListener("change", nodeStatus);
nodeStatus();
const q = new URLSearchParams(location.search).get("h");
if (q) { $("hash").value = q; check(q); }
</script>
</body>
</html>
